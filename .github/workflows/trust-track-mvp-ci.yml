name: Trust & Track MVP CI

on:
  pull_request:
    paths:
      - 'trust-track-mvp/**'
      - '.github/workflows/trust-track-mvp-ci.yml'
  push:
    branches:
      - 'agent/trust-track-mvp-foundation'
    paths:
      - 'trust-track-mvp/**'
      - '.github/workflows/trust-track-mvp-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trust-track-mvp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Test routing, deduplication, and polling
        run: npm run test --workspace @trust-track/api

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trust_track
        run: npm run db:generate

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trust_track
        run: npx prisma validate --schema packages/database/prisma/schema.prisma

      - name: Build web dashboard
        run: npm run build
